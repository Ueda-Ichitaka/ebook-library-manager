# About this file: docker compose services for the ebookprep tool.
# "identify" decides the metadata of new books in ./input (read-only): accepted, or
#   waiting for review. "detect-moves" recognises known files moved or renamed in ./input
#   (identify and build do this first, too). "relookup" asks the sources again for the books waiting for
#   review. The Google Books API key is read from ./api-keys.env (optional,
#   git-ignored), by identify, relookup and the review UI (its actions and ISBN lookups). "rescore" re-decides stored books with the current rules. "build" writes accepted books into ./output. "report" writes
#   ./work/report.md with the newest result of every book across all runs. State, reports
#   and temporary files go to ./work. Extra arguments are passed on, e.g.
#     docker compose run --rm identify --only IT/Android
# "kavita-check" asks the local Kavita (login from ./kavita.env) whether every built book
#   is its own series named after its title; add --scan to rescan the libraries first.
# "review" serves the review web UI at http://localhost:8000 (local machine only). Its
#   actions page runs identify, build, report and the Kavita check as background jobs.
# "tests" runs the pytest suite inside the pinned calibre/Python image.
# "kavita" is a local Kavita (same version as the server) showing ./output read-only at
#   http://localhost:5000, to see the result the way the server will show it. Its
#   configuration (admin user, libraries, database) lives in ./kavita-config, which is
#   git-ignored. It runs as the host user, so those files stay owned by you.
# Profile "e2e": end-to-end test against a fresh Kavita (in-memory config, new on every run):
#   docker compose --profile e2e build e2e
#   docker compose --profile e2e run --rm e2e
#   docker compose --profile e2e rm -sf kavita-e2e
# Source and tests are mounted read-only, so code changes are picked up without rebuilding.

x-ebookprep: &ebookprep
  build:
    context: .
    target: runtime
  image: ebookprep:latest
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ./input:/data/input:ro
    - ./output:/data/output
    - ./work:/data/work
    - ./src:/app/src:ro
    - ./config.toml:/app/config.toml:ro

services:
  identify:
    <<: *ebookprep
    env_file:
      - path: api-keys.env
        required: false
    entrypoint: ["python", "-m", "ebookprep", "identify",
                 "--input", "/data/input", "--work", "/data/work", "--config", "/app/config.toml"]

  detect-moves:
    <<: *ebookprep
    entrypoint: ["python", "-m", "ebookprep", "detect-moves",
                 "--input", "/data/input", "--work", "/data/work", "--config", "/app/config.toml"]

  relookup:
    <<: *ebookprep
    env_file:
      - path: api-keys.env
        required: false
    entrypoint: ["python", "-m", "ebookprep", "relookup",
                 "--input", "/data/input", "--work", "/data/work", "--config", "/app/config.toml"]

  rescore:
    <<: *ebookprep
    entrypoint: ["python", "-m", "ebookprep", "rescore", "--input", "/data/input", "--work", "/data/work"]

  build:
    <<: *ebookprep
    entrypoint: ["python", "-m", "ebookprep", "build", "--input", "/data/input",
                 "--output", "/data/output", "--work", "/data/work", "--config", "/app/config.toml"]

  report:
    <<: *ebookprep
    entrypoint: ["python", "-m", "ebookprep", "report", "--work", "/data/work"]

  kavita-check:
    <<: *ebookprep
    env_file: kavita.env
    depends_on:
      - kavita
    entrypoint: ["python", "-m", "ebookprep", "kavita-check", "--output", "/data/output", "--work", "/data/work",
                 "--config", "/app/config.toml", "--url", "http://kavita:5000", "--library-root", "/library"]

  review:
    <<: *ebookprep
    env_file:
      - kavita.env
      - path: api-keys.env
        required: false
    entrypoint: ["python", "-m", "ebookprep", "review", "--input", "/data/input", "--work", "/data/work",
                 "--output", "/data/output", "--config", "/app/config.toml", "--kavita-url", "http://kavita:5000",
                 "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"

  tests:
    build:
      context: .
      target: test
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - ./config.toml:/app/config.toml:ro

  kavita:
    image: jvmilazz0/kavita:0.9.1   # assembly version 0.9.1.4, same as the server
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./output:/library:ro
      - ./kavita-config:/kavita/config
    ports:
      - "127.0.0.1:5000:5000"

  kavita-e2e:
    image: jvmilazz0/kavita:0.9.1   # assembly version 0.9.1.4, same as the server
    profiles: ["e2e"]
    tmpfs:
      - /kavita/config
    volumes:
      - e2e-library:/library:ro

  e2e:
    build:
      context: .
      target: test
    profiles: ["e2e"]
    user: "0:0"   # writes into the shared Docker volume, which belongs to root
    depends_on:
      - kavita-e2e
    environment:
      KAVITA_E2E_URL: http://kavita-e2e:5000
      E2E_LIBRARY: /e2e/library
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      - e2e-library:/e2e/library
    command: ["pytest", "-m", "kavita", "-v"]

volumes:
  e2e-library:
