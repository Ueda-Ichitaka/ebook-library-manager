# About this file: pytest settings for the ebookprep test suite.
# The cache provider is disabled because the suite runs from a read-only mount in Docker.
[pytest]
testpaths = tests
pythonpath = src
addopts = -p no:cacheprovider -ra
markers =
    calibre: needs the calibre command-line tools (available in the Docker image)
    kavita: needs the Kavita of the compose profile e2e (end-to-end test)
