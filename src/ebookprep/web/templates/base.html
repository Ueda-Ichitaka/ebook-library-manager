{# About this file: page layout of the review UI (header, styles, htmx). #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ebookprep review{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --line: #deded8; --card: #ffffff;
            --accent: #2f5d8a; --ok: #2e7d4f; --warn: #a3541b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181a; --fg: #e8e8e4; --muted: #9a9a94; --line: #34343a; --card: #222226;
              --accent: #7fb0e0; --ok: #6cc391; --warn: #e39a62; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
    header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 20px; align-items: baseline; }
    header a { color: var(--fg); text-decoration: none; font-weight: 600; }
    main { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    .reason { color: var(--warn); }
    .counts span { margin-right: 18px; }
    .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 14px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 13px; color: var(--muted); margin-top: 8px; }
    input, textarea { width: 100%; padding: 6px 8px; font: inherit; color: var(--fg); background: var(--bg);
                      border: 1px solid var(--line); border-radius: 6px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: var(--bg); cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    .cover { max-width: 70px; max-height: 100px; }
    .warn { color: var(--warn); }
    .excerpt { max-height: 240px; overflow: auto; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <a href="/">ebookprep review</a>
    <a class="muted" href="/?status=review">review queue</a>
    <a class="muted" href="/?status=accepted">accepted</a>
    <a class="muted" href="/?status=all">all</a>
    <a class="muted" href="/duplicates">duplicates</a>
    <a class="muted" href="/excluded">excluded files</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
